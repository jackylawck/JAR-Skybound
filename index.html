<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a2a4a">

    <!-- 🛡️ 企業級強化 CSP：合法精準指令集 -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline' blob:;
        worker-src 'self' blob:;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        connect-src 'self' blob:;
        font-src 'self' data:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
    ">

    <!-- 🛡️ 跨來源隔離與隱私安全 Meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(self), gyroscope=(self)">

    <!-- 🔍 Google 網站驗證 -->
    <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />

    <!-- 🌐 雙語全球 SEO 標籤 -->
    <title>J.A.R. 衝上雲霄 Pro | J.A.R. Skybound Pro 3D</title>
    <meta name="description" content="J.A.R. Skybound Pro is a high-fidelity 6-DoF WebGL flight simulator featuring NASA CRM aerodynamic data, dual turbofan dynamics, Pacejka ground model, and ARINC-717 FDR telemetry.">
    <meta name="keywords" content="J.A.R., Joint Applied Research, 聯合應用科學探索, Skybound Pro, 衝上雲霄, Flight Simulator, Three.js, WebGL, 6-DoF, NASA CRM, ARINC 717, PWA">
    <meta name="author" content="Jacky Law">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://jackylawck.github.io/JAR-Skybound/">

    <!-- 📱 Open Graph 社群分享卡片 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jackylawck.github.io/JAR-Skybound/">
    <meta property="og:title" content="J.A.R. 衝上雲霄 Pro | Skybound Pro Flight Simulator">
    <meta property="og:description" content="高保真 WebGL 6-DoF 飛行模擬沙盒，支援 NASA CRM 風洞氣動模型、雙發渦扇動力與 ARINC-717 黑匣子數據記錄。">
    <meta property="og:image" content="https://jackylawck.github.io/JAR-Skybound/jarSkybound512icon.png">

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://jackylawck.github.io/JAR-Skybound/">
    <meta name="twitter:title" content="J.A.R. Skybound Pro | Joint Applied Research">
    <meta name="twitter:description" content="Scientific-grade Web 6-DoF flight simulator with real-time HUD, NASA CRM aerodynamics, and telemetry analysis.">
    <meta name="twitter:image" content="https://jackylawck.github.io/JAR-Skybound/jarSkybound512icon.png">

    <!-- 🔍 Google 結構化資料 (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "J.A.R. Skybound Pro",
      "alternateName": "J.A.R. 衝上雲霄 Pro - 聯合應用科學探索",
      "url": "https://jackylawck.github.io/JAR-Skybound/",
      "description": "An open-source, high-fidelity WebGL 6-DoF flight simulator featuring NASA CRM aerodynamics, dual-turbofan engine dynamics, and real-time flight telemetry recording.",
      "applicationCategory": "SimulationApplication, EducationalApplication",
      "operatingSystem": "All"
    }
    </script>

    <!-- 📲 完整跨平台 PWA 與 Favicon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="jarSkybound192icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="jarSkybound512icon.png">
    <link rel="apple-touch-icon" href="jarSkybound192icon.png">
    <meta name="msapplication-TileColor" content="#1a2a4a">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 啟動與難度配置面板 -->
<div id="start-screen">
    <div class="header-bar">
        <button id="btn-lang" class="pill-btn">English</button>
    </div>
    
    <div class="logo-box">
        <h1 id="ui-title">J.A.R. 衝上雲霄 Pro</h1>
        <h3 id="ui-subtitle" class="subtitle">PWA 飛行模擬器</h3>
    </div>

    <!-- 難度與環境選擇器 -->
    <div class="setup-grid">
        <div class="setup-card">
            <span id="ui-mode-label" class="setup-title">模擬級別</span>
            <div class="opt-group" id="group-level">
                <button class="opt-btn" data-val="junior">學員 / 兒童</button>
                <button class="opt-btn active" data-val="advanced">進階飛手</button>
                <button class="opt-btn" data-val="captain">機長 / 專業</button>
            </div>
        </div>

        <div class="setup-card">
            <span id="ui-weather-label" class="setup-title">天氣環境</span>
            <div class="opt-group" id="group-weather">
                <button class="opt-btn active" data-val="day">晴空 (日間)</button>
                <button class="opt-btn" data-val="sunset">黃昏日落</button>
                <button class="opt-btn" data-val="night">夜間儀表</button>
                <button class="opt-btn" data-val="storm">暴風雨</button>
            </div>
        </div>
    </div>

    <div class="controls-box">
        <button id="start-btn" class="glow-btn">進入駕駛艙 / 啟動引擎</button>
    </div>
</div>

<!-- 主模擬器視圖 -->
<div id="sim-interface">
    <div id="canvas-container"></div>

    <!-- 頂部即時環境狀態條 -->
    <div id="telemetry-bar">
        <span id="tel-mode">LEVEL: ADVANCED</span>
        <span id="tel-env">ENV: DAY CLEAR</span>
        <span id="tel-wind">WIND: 080° / 12kt</span>
        <span id="tel-qbar">QBAR: 8.2 kPa</span>
    </div>

    <!-- 左上角 EICAS 發動機即時監控小儀表 -->
    <div id="eicas-display">
        <div class="eicas-title">ENGINE & FUEL (EICAS)</div>
        <div class="eicas-grid">
            <div class="eicas-col">
                <span class="eng-name">ENG 1 (L)</span>
                <div class="eng-stat">N1: <span id="eicas-n1-1">20.0</span>%</div>
                <div class="eng-stat">EGT: <span id="eicas-egt-1">420</span>°C</div>
                <div class="eng-stat">FF: <span id="eicas-ff-1">380</span> kg/h</div>
            </div>
            <div class="eicas-col">
                <span class="eng-name">ENG 2 (R)</span>
                <div class="eng-stat">N1: <span id="eicas-n1-2">20.0</span>%</div>
                <div class="eng-stat">EGT: <span id="eicas-egt-2">420</span>°C</div>
                <div class="eng-stat">FF: <span id="eicas-ff-2">380</span> kg/h</div>
            </div>
        </div>
    </div>

    <!-- 右上角教官故障台 (IOS) 與 FDR 黑匣子 -->
    <div id="ios-panel">
        <button id="btn-fdr-export" class="ios-btn fdr-btn">📥 導出 FDR 黑匣子 (CSV)</button>
        <button id="btn-fault-eng1" class="ios-btn fault-btn">⚠️ 左發停車 (ENG 1 FAIL)</button>
        <button id="btn-fault-eng2" class="ios-btn fault-btn">⚠️ 右發停車 (ENG 2 FAIL)</button>
    </div>

    <!-- 即時遙測示波器 (含模式切換) -->
    <div id="oscilloscope-container">
        <div class="scope-header">
            <span id="scope-mode-label">AERO (AoA/Pitch/G)</span>
            <div class="scope-btns">
                <button id="btn-scope-mode" class="scope-toggle-btn">切換通道</button>
                <button id="btn-toggle-scope" class="scope-toggle-btn">收起/展開</button>
            </div>
        </div>
        <canvas id="oscilloscope-canvas" width="240" height="110"></canvas>
    </div>

    <!-- 駕駛艙遮罩與 MCP 面板 -->
    <div id="cockpit-overlay">
        <div class="cockpit-frame-left"></div>
        <div class="cockpit-frame-right"></div>
        
        <div class="cockpit-glare-shield">
            <div class="mcp-panel">
                <button id="btn-ap" class="mcp-btn">A/P</button>
                <button id="btn-lnav" class="mcp-btn">LNAV</button>
                <button id="btn-vnav" class="mcp-btn">VNAV</button>
                
                <div class="mcp-group">
                    <span class="mcp-label">SPD</span>
                    <button class="mcp-step-btn" id="spd-dec">-</button>
                    <span id="mcp-spd-val" class="mcp-val">250</span>
                    <button class="mcp-step-btn" id="spd-inc">+</button>
                </div>

                <div class="mcp-group">
                    <span class="mcp-label">HDG</span>
                    <button class="mcp-step-btn" id="hdg-dec">-</button>
                    <span id="mcp-hdg-val" class="mcp-val">360</span>
                    <button class="mcp-step-btn" id="hdg-inc">+</button>
                </div>

                <div class="mcp-group">
                    <span class="mcp-label">ALT</span>
                    <button class="mcp-step-btn" id="alt-dec">-</button>
                    <span id="mcp-alt-val" class="mcp-val">10000</span>
                    <button class="mcp-step-btn" id="alt-inc">+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 手機觸控操控層 -->
    <div id="touch-controls">
        <div id="left-controls">
            <div class="throttle-container">
                <span id="ui-thr-label" class="ctrl-label">油門</span>
                <input type="range" id="touch-throttle" min="0" max="100" value="60" orient="vertical">
                <span id="thr-val-text">60%</span>
            </div>
            
            <div class="rudder-bar">
                <button id="btn-rud-left" class="pedal-btn">◀</button>
                <button id="btn-brake" class="pedal-btn brake-btn">BRK</button>
                <button id="btn-rud-right" class="pedal-btn">▶</button>
            </div>
        </div>

        <div id="right-controls">
            <div id="virtual-stick-zone">
                <div id="virtual-stick-knob"></div>
            </div>
        </div>
    </div>
</div>

<!-- 🛡️ Three.js CDN：填入精確的 sha512 SRI 驗證碼 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" 
        integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZYtA3YjDUCjT0HDOHKxNVydf3hU4JjM8uEhxf9Nd1/ey98U3t2vZ0qQ==" 
        crossorigin="anonymous" 
        referrerpolicy="no-referrer"></script>
<script type="module" src="main.js"></script>

</body>
</html>
